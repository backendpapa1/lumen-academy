# Model routing. See docs/04-MODELS-AND-PROVIDERS.md, ADR-002, ADR-004, ADR-007.
# Never hard-code model IDs in code: everything goes through models/factory.ts.
#
# ADR-007 (20 Oct 2026, user decision): every agent runs on DeepSeek Flash.
# Roles differ only by thinking and reasoning effort. OpenAI is used only for
# embeddings and images.
profile: flash # LUMEN_PROFILE overrides; must name a profile below

providers:
  openai:
    apiKeyEnv: OPENAI_API_KEY
    baseURL: https://api.openai.com/v1
    timeoutMs: 20000
  deepseek:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com
    timeoutMs: 20000
  # v2 practice mode (VD12): llama.cpp's llama-server on this machine. Not used
  # unless LUMEN_PROFILE=local. Start it with: pnpm local:llm
  local:
    apiKeyEnv: LUMEN_LOCAL_KEY
    baseURL: http://127.0.0.1:8091/v1
    timeoutMs: 60000

profiles:
  flash:
    # Realtime classroom calls: no thinking, for latency.
    fastest: { provider: deepseek, model: deepseek-flash, thinking: off, temperature: 0.7 }
    fast: { provider: deepseek, model: deepseek-flash, thinking: off, temperature: 0.8 }
    # Judgement calls (Director, Registrar, homework…): light thinking.
    standard:
      provider: deepseek
      model: deepseek-flash
      thinking: on
      reasoningEffort: low
      timeoutMs: 90000
    # Accuracy against the source (curriculum, exams, grading): full thinking.
    heavy:
      provider: deepseek
      model: deepseek-flash
      thinking: on
      reasoningEffort: high
      timeoutMs: 240000
    embeddings: { provider: openai, model: text-embedding-3-small }
    image: { provider: openai, model: gpt-image-1-mini }
  # Practice on this machine (VD12, spike V8-S1): every text role on Qwen3-4B.
  local:
    fastest: { provider: local, model: qwen3-4b-instruct-2507, temperature: 0.7, timeoutMs: 120000 }
    fast: { provider: local, model: qwen3-4b-instruct-2507, temperature: 0.8, timeoutMs: 180000 }
    standard:
      { provider: local, model: qwen3-4b-instruct-2507, temperature: 0.6, timeoutMs: 120000 }
    heavy: { provider: local, model: qwen3-4b-instruct-2507, temperature: 0.4, timeoutMs: 240000 }
    embeddings: { provider: openai, model: text-embedding-3-small }
    image: { provider: openai, model: gpt-image-1-mini }

# Single-model setup: a role "falls back" to the same model, i.e. one more try.
# The factory skips entries equal to the primary, so these are effectively empty.
fallbacks:
  fastest: [deepseek:deepseek-flash]
  fast: [deepseek:deepseek-flash]
  standard: [deepseek:deepseek-flash]
  heavy: [deepseek:deepseek-flash]

# Per-agent overrides beat the role mapping.
agents:
  crowdReactor: { role: fastest, maxOutputTokens: 700 } # ADR-002; ~15 cadets + 3 hands
  classDirector: { role: fast, maxOutputTokens: 1500 } # ADR-002 (spike M1-S1): thinking off beat on
  cadetTalk: { role: fast, maxOutputTokens: 220, temperature: 0.9 }
  cadetHomework: { role: standard, maxOutputTokens: 2500 } # includes thinking tokens
  notesRewriter: { role: fast, maxOutputTokens: 450 }
  leakGuard: { role: fastest, maxOutputTokens: 60, sampleRate: 0.5 }
  registrar: { role: fast } # flavour needs no reasoning; thinking made first arrivals ~8s
  curriculumArchitect: { role: heavy }
  examiner: { role: heavy }
  grader: { role: heavy }
  dean: { role: standard }
  debriefAnalyst: { role: standard }
  recapWriter: { role: fast }
  yearbookEditor: { role: standard }
  alumniPinger: { role: fast }
  artDirector: { role: fast, maxOutputTokens: 120 } # emblem motifs (docs/07 §2.2)
  transcriptFixer: { role: fastest, maxOutputTokens: 200, temperature: 0 } # V1: mishearings only
  knowledgeReporter: { role: fast, maxOutputTokens: 400 } # V2-07: a summary of the numbers only
  peerGrader: { role: fastest, maxOutputTokens: 120, temperature: 0 } # V4-02: right or wrong by the key facts
  teachBack: { role: fast, maxOutputTokens: 500 } # V5-03: phrases the student's own statements
  analogyMaker: { role: fast, maxOutputTokens: 600 } # V5-04: 3 analogies, sound and misleading
  modeJudge: { role: fast, maxOutputTokens: 400, temperature: 0 } # V5: analogy reasons, ELI fit, parent verdicts
  substitute: { role: fast, maxOutputTokens: 900 } # V5-08: a lesson with planted errors the server chose
  guestLecturer: { role: fast, maxOutputTokens: 600 } # V5-09: answers from my sources, with citations
  parent: { role: fast, maxOutputTokens: 300, temperature: 0.7 } # V5-10

budget:
  monthlyUsdCap: 20
  imagesUsdCap: 5 # images' share of the cap (docs/07 §6)
  softWarnAt: 0.8 # 80% → toast
  degradeAt: 0.95 # 95% → all roles degrade to fastest (degrade_then_pause only)
  onCap: degrade_then_pause # at 100% agents pause; the cap is hard

# V1 voice (v2-dev-plan VD1–VD4, measured in gates/V1-spikes.md). Local only.
# Paths are per machine; LUMEN_WHISPER_BIN / LUMEN_WHISPER_MODEL override them.
speech:
  stt:
    engine: whispercpp
    binary: ~/.cache/lumen/whisper.cpp/build-vk/bin/whisper-server # Vulkan build (Radeon 780M)
    # On Paul's own voice: small.en 31% WER, large-v3-turbo 19% (0.62 s p50); the
    # fixer pass below takes it to ~17% and fixes the jargon (gates/V1-spikes.md).
    model: ~/.cache/lumen/whisper.cpp/models/ggml-large-v3-turbo-q5_0.bin
    language: en
    correct: true
    port: 8092
    threads: 4
    glossaryChars: 600
  tts:
    engine: kokoro
    model: onnx-community/Kokoro-82M-v1.0-ONNX
    dtype: q4 # as fast as fp32 on this CPU at a quarter of the size; q8 is slow here
    cacheDir: ~/.cache/lumen/models/hf
    # Kokoro's own grades, C- and up first; the male set is short, so D voices fill it.
    voices:
      female:
        [
          af_heart,
          af_bella,
          af_nicole,
          bf_emma,
          af_aoede,
          af_kore,
          af_sarah,
          af_alloy,
          af_nova,
          bf_isabella,
          af_sky,
        ]
      male: [am_michael, am_fenrir, am_puck, bm_george, bm_fable, bm_lewis, am_echo, am_liam]
    speed:
      skeptic: 1.0
      lost_signal: 0.94
      overachiever: 1.12
      literalist: 0.97
      pragmatist: 1.04
      connector: 1.06
      quiet: 0.9
      saboteur: 1.08
    firstChunkWords: 6
