# Model routing. See docs/04-MODELS-AND-PROVIDERS.md, ADR-002, ADR-004, ADR-007.
# Never hard-code model IDs in code: everything goes through models/factory.ts.
#
# ADR-007 (20 Oct 2026, user decision): every agent runs on DeepSeek Flash.
# Roles differ only by thinking and reasoning effort. OpenAI is used only for
# embeddings and images.
profile: flash # LUMEN_PROFILE overrides; must name a profile below

providers:
  openai:
    apiKeyEnv: OPENAI_API_KEY
    baseURL: https://api.openai.com/v1
    timeoutMs: 20000
  deepseek:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com
    timeoutMs: 20000

profiles:
  flash:
    # Realtime classroom calls: no thinking, for latency.
    fastest: { provider: deepseek, model: deepseek-flash, thinking: off, temperature: 0.7 }
    fast: { provider: deepseek, model: deepseek-flash, thinking: off, temperature: 0.8 }
    # Judgement calls (Director, Registrar, homework…): light thinking.
    standard:
      provider: deepseek
      model: deepseek-flash
      thinking: on
      reasoningEffort: low
      timeoutMs: 90000
    # Accuracy against the source (curriculum, exams, grading): full thinking.
    heavy:
      provider: deepseek
      model: deepseek-flash
      thinking: on
      reasoningEffort: high
      timeoutMs: 240000
    embeddings: { provider: openai, model: text-embedding-3-small }
    image: { provider: openai, model: gpt-image-1-mini }

# Single-model setup: a role "falls back" to the same model, i.e. one more try.
# The factory skips entries equal to the primary, so these are effectively empty.
fallbacks:
  fastest: [deepseek:deepseek-flash]
  fast: [deepseek:deepseek-flash]
  standard: [deepseek:deepseek-flash]
  heavy: [deepseek:deepseek-flash]

# Per-agent overrides beat the role mapping.
agents:
  crowdReactor: { role: fastest, maxOutputTokens: 700 } # ADR-002; ~15 cadets + 3 hands
  classDirector: { role: fast, maxOutputTokens: 1500 } # ADR-002 (spike M1-S1): thinking off beat on
  cadetTalk: { role: fast, maxOutputTokens: 220, temperature: 0.9 }
  cadetHomework: { role: standard, maxOutputTokens: 2500 } # includes thinking tokens
  notesRewriter: { role: fast, maxOutputTokens: 450 }
  leakGuard: { role: fastest, maxOutputTokens: 60, sampleRate: 0.5 }
  registrar: { role: standard }
  curriculumArchitect: { role: heavy }
  examiner: { role: heavy }
  grader: { role: heavy }
  dean: { role: standard }
  debriefAnalyst: { role: standard }
  recapWriter: { role: fast }
  yearbookEditor: { role: standard }
  alumniPinger: { role: fast }

budget:
  monthlyUsdCap: 20
  softWarnAt: 0.8 # 80% → toast
  degradeAt: 0.95 # 95% → all roles degrade to fastest (degrade_then_pause only)
  onCap: degrade_then_pause # at 100% agents pause; the cap is hard
