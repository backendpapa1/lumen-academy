# Game tunables. Server code reads these; never inline them.
period:
  defaultMinutes: 15
  minMinutes: 5
  maxMinutes: 45
  resumeWithinHours: 12 # reopen the tab within this and the period continues

cohort: { min: 4, mode: 9, max: 15 } # triangular distribution (docs/03 §5.2)
classroomsPerSchool: 6

cadet:
  maxWords: 60

# The mirror (docs/03 §4.3, ADR-006 D4). Tuned by scripts/sim-comprehension (M1-S3).
comprehension:
  base: 0.24 # tuned by pnpm sim:comprehension --search (spike M1-S3)
  styleBonus: 0.05
  directorAdjustBound: 0.10
  deltaMin: -0.3
  deltaMax: 0.4
  misconceptionAdoption: 0.6 # p = (1 - skepticism) × this
  lowConfidenceWeight: 0.5 # deltas from a Director fallback turn count at 50%
  understoodAt: 0.75

# V2 forgetting (v2-dev-plan VD5): recall = c × (floor + (1 − floor) × 0.5^(days / halfLife)).
# A review at least spacedAfterHours after the last one multiplies the half-life by growth.
memory:
  halfLifeDays: 2
  growth: 1.8 # 2 → 3.6 → 6.5 → 11.7 → 21 days…
  maxHalfLifeDays: 90
  floor: 0.35 # you never forget everything you understood
  spacedAfterHours: 12
  fadingAt: 0.75 # recalled below 75% of its strength → "your class is forgetting"

# V2-05 mistake journal: a student re-asks about something I got wrong, spaced out.
mistakes:
  intervalsDays: [1, 3, 7] # next re-check after 0, 1, 2… right answers
  settleAfter: 2 # right twice and it's settled
  fromTurn: 2
  passScore: 3 # on the Grader's 1–5

# Registration (docs/03 §5.2). Archetypes are drawn in code (seeded); the LLM writes flavour only.
registration:
  batchSize: 3 # students per flavour call, so the first arrivals appear fast
  portraits: false # students are drawn (ADR-009); no portrait images
  guaranteed: # always present, in this order, once the cohort reaches the size
    - { archetype: skeptic, minSize: 1 }
    - { archetype: lost_signal, minSize: 1 }
    - { archetype: literalist, minSize: 1 }
    - { archetype: overachiever, minSize: 6 }
    - { archetype: pragmatist, minSize: 8 }
  weights: # remaining slots; saboteur only when unlocked
    standard:
      {
        lost_signal: 3,
        skeptic: 2,
        connector: 2,
        pragmatist: 2,
        quiet: 2,
        literalist: 1,
        overachiever: 1,
      }
    gentle:
      {
        lost_signal: 2,
        skeptic: 1,
        connector: 2,
        pragmatist: 3,
        quiet: 3,
        literalist: 3,
        overachiever: 1,
      }
    ruthless:
      {
        lost_signal: 2,
        skeptic: 4,
        connector: 1,
        pragmatist: 1,
        quiet: 1,
        literalist: 1,
        overachiever: 3,
        saboteur: 2,
      }
  # Hometowns (the field keeps its old name; ADR-009).
  homeworlds:
    [
      Lagos,
      Nairobi,
      São Paulo,
      Accra,
      Manchester,
      Seoul,
      Lisbon,
      Toronto,
      Mumbai,
      Cairo,
      Mexico City,
      Hanoi,
      Kraków,
      Kingston,
      Istanbul,
    ]
  # Sampled in code so classes are diverse (docs/07 §2.1); the LLM fits names and looks to them.
  heritage:
    [
      West African,
      East African,
      South Asian,
      East Asian,
      Southeast Asian,
      Latin American,
      Middle Eastern,
      Northern European,
      Southern European,
      Pacific Islander,
      Caribbean,
      Central Asian,
    ]
  genderPresentation: [feminine, masculine, androgynous]
  ageRange: [late teens, early twenties, mid twenties]

# Archetype trait means (docs/03 §5.3); each cadet draws ± traitSpread around them (seeded).
traitSpread: 0.12
archetypes:
  skeptic:
    { attention: 0.7, skepticism: 0.9, curiosity: 0.6, verbosity: 0.5, confidence: 0.8, humor: 0.3 }
  lost_signal:
    {
      attention: 0.45,
      skepticism: 0.3,
      curiosity: 0.6,
      verbosity: 0.6,
      confidence: 0.3,
      humor: 0.5,
    }
  overachiever:
    { attention: 0.9, skepticism: 0.5, curiosity: 0.9, verbosity: 0.7, confidence: 0.8, humor: 0.4 }
  literalist:
    {
      attention: 0.65,
      skepticism: 0.5,
      curiosity: 0.5,
      verbosity: 0.4,
      confidence: 0.5,
      humor: 0.3,
    }
  pragmatist:
    { attention: 0.6, skepticism: 0.6, curiosity: 0.6, verbosity: 0.5, confidence: 0.6, humor: 0.5 }
  connector:
    { attention: 0.6, skepticism: 0.4, curiosity: 0.8, verbosity: 0.7, confidence: 0.6, humor: 0.7 }
  quiet:
    { attention: 0.5, skepticism: 0.5, curiosity: 0.4, verbosity: 0.1, confidence: 0.3, humor: 0.3 }
  saboteur:
    {
      attention: 0.6,
      skepticism: 0.2,
      curiosity: 0.5,
      verbosity: 0.7,
      confidence: 0.95,
      humor: 0.6,
    }

fatigue: # attention multiplier: 1.0 until onset, then declines per minute to floor
  onsetMinute: 10
  perMinute: 0.03
  floor: 0.6

status: # concept status derivation (docs/06 §3)
  weakScore: 0.6
  weakComprehension: 0.5
  weakMinExposures: 7 # mean turns per cadet; an average cadet needs ~6 clear turns (sim M1-S3)
  masteredScore: 0.7
  masteredComprehension: 0.7

exam:
  passThreshold: 0.7
  unlockTaughtFraction: 0.7

streak:
  timezone: Africa/Lagos # days are counted in this zone (docs/06 §4)
  freezeEveryDays: 7 # V3-07: a week of streak earns a freeze (covers one missed day)
  maxFreezes: 2

modes: # V5 (VD11): each teaching mode behind its own flag
  socratic: true
  teach_back: true
  analogy_lab: true
  eli_ladder: true
  substitute: true
  guest: true # guest lecturer (sources only, with citations)
  parentMeeting: true
  guestPerWeek: 5

micro: # V3-01: one idea, one student, one exit question
  minutes: 3

buildingTiers: [0.25, 0.6, 1.0] # mastered fraction for tiers 2, 3, 4 (docs/02 §7.3)

xp: # docs/02 §7.1
  teachingMinute: 10
  questionAnswered: 15
  misconceptionCorrected: 30
  submissionGraded: 10
  exitTicketComplete: 25
  examPassPerAvgScore: 200
  glitchCaught: 50
  popQuizPerPoint: 6 # pop quiz: Grader score 0–5 × this
  microLesson: 25 # V3-01: flat, instead of teachingMinute (a reduced rate)
  teachBackCatch: 20 # V5-03: per mistake caught in a teach-back
  analogyJudged: 20 # V5-04: × score (verdict right + reason)
  eliRound: 20 # V5-05: × fit score per round
  substituteCatch: 25 # V5-08: per planted error caught

ranks: # placeholder thresholds; tune after M5
  - { name: Student Teacher, minXp: 0 }
  - { name: Teacher, minXp: 500 }
  - { name: Senior Teacher, minXp: 2000 }
  - { name: Head of Department, minXp: 6000 }
  - { name: Principal, minXp: 15000 }
  - { name: Chancellor, minXp: 40000 }

pastClaims: # V4-05: students remember what I said in earlier classes (my words, not the source)
  enabled: true
  minSimilarity: 0.5 # cosine, text-embedding-3-small
  max: 2

arcs: # V4-03 (VD10): growth arcs move only by these server rules
  enabled: true
  skepticReasons: 2 # reasoned turns in a row ("because…", "which means…")
  quietCalls: 3 # times called on
  lostFixes: 1 # misconceptions cleared
  saboteurKind: 1 # kind corrections ("I see why you'd think that, but…")

# V4-04: everyday interests (new students get theirs from the Registrar; older ones from here)
interests:
  [
    football,
    cooking,
    music,
    gaming,
    basketball,
    drawing,
    films,
    running,
    gardening,
    fashion,
    cycling,
    baking,
  ]

stickers: # V4-06: students hand them out for great moments
  enabled: true
  maxPerPeriod: 3

peerTalk: # V4-01/02 (VD9): students talk to each other, only from what they've been taught
  enabled: true
  maxPerPeriod: 2
  fromTurn: 3 # teaching turns before the first exchange
  minTurnsBetween: 4
  correctGain: 0.05 # a correct peer explanation nudges the listener (a teacher's turn moves more)

events:
  enabled: true
  maxPerPeriod: 1
  # An event can happen once this many teaching turns have passed (random in range).
  earliestTurn: 4
  latestTurn: 9
  # Which events can happen (docs/02 §6). Transfer, inspector and debate come later.
  kinds: [pop_quiz, glitch, power_flicker, inspector]

leakGuard:
  enabled: true
  untaughtTermThreshold: 2 # > this many untaught technical tokens forces a check

hands:
  autoPick: false
  idleSeconds: 4
  maxPerTurn: 3
