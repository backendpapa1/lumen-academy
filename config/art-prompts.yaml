style:
  # ADR-009: flat, hand-drawn line art like the classroom (Open Peeps-style),
  # cobalt ink on bright flat colour.
  global: >
    Flat hand-drawn vector illustration, bold confident cobalt blue (#2A40FF)
    outlines of even weight, flat fills with no gradients and no shading, a bright
    friendly palette of white, sky blue (#C6ECFF) and marigold (#FFC23D), playful
    and clean, editorial illustration style, no text, no watermark, no logos.
  portrait: >
    Head-and-shoulders character portrait, centered, facing camera at a slight
    three-quarter angle, neutral studio backdrop, soft rim light in {{accent}},
    sleek futuristic academy uniform with a high collar and thin light piping,
    expressive but calm face, photoreal-illustrative hybrid, cinematic.
  emblem: >
    A school badge: one simple, memorable symbolic object for the subject, drawn
    big and centered inside a round badge, accent colour {{accent}} used for one
    or two shapes, on a transparent background, readable at small sizes, no letters,
    no numbers.
  space: >
    Deep-space backdrop in the style of long-exposure astrophotography. Only gas,
    dust and stars: no buildings, no rooms, no furniture, no spacecraft, no
    horizon, no frame. Fills the entire image edge to edge.
  texture: >
    Seamless tileable sci-fi surface texture, orthographic top-down, even lighting,
    no perspective, no shadows baked from a single direction.
constraints:
  default: "No text. No words. No letters. No watermark."
  transparent_fallback: "Plain solid #00FF00 chroma-green background, no shadow on background."

# Prompt templates (docs/07 §2). {{style.x}}, {{constraints.x}} and {{var}}
# are filled in code (apps/server/src/assets/prompts.ts).
templates:
  portrait: >
    {{style.global}} {{style.portrait}}
    Subject: {{ageRange}} {{genderPresentation}} cadet of {{heritageHint}} heritage
    from {{homeworld}}. Personality reads as {{archetypeVisual}}.
    Distinctive detail: {{visualQuirk}}. Hair: {{hair}}. Accent color: {{accent}}.
    Isolated on a fully transparent background, nothing behind the figure.
    {{constraints.default}}
  emblem: >
    {{style.global}} {{style.emblem}}
    Symbolizes the subject "{{schoolName}}": {{emblemMotifs}}.
    {{constraints.default}}

# How each archetype reads on a face (docs/07 §2.1).
archetypeVisual:
  skeptic: sharp, appraising gaze, one brow slightly raised
  lost_signal: earnest, slightly puzzled, open expression
  overachiever: bright, eager, intensely focused
  literalist: precise, composed, attentive to detail
  connector: warm, curious, a hint of a smile
  pragmatist: grounded, practical, steady eye contact
  quiet: thoughtful, reserved, soft gaze
  saboteur: confident, faintly mischievous half-smile
