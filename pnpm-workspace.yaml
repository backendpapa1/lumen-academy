packages:
  - apps/*
  - packages/*
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # The prebuilt binding ships in the package; its install script only fetches CUDA providers.
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  # Its only install script is an Open Collective donation banner.
  tesseract.js: false
