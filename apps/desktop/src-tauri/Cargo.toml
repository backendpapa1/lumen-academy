[package]
name = "lumen-academy"
version = "0.8.0"
description = "Lumen Academy: learn by teaching a class of AI students."
authors = ["Paul Akeju"]
edition = "2021"
rust-version = "1.85"

[lib]
# Android loads the app as a shared library (ADR-012); the desktop binary links the rlib.
name = "lumen_academy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumen-academy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["image-png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# The desktop shell (ADR-011): tray, sidecar, keyring, native sound. None of it is on Android.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "=2.4.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.1"
keyring = "=4.2.0"
ureq = "=3.4.2"
dirs = "=7.0.0"
# Native playback: WebKitGTK's own audio output is unreliable (src/audio.rs).
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The microphone for voice teaching: WebKitGTK needs media streams switched on
# and the permission request answered (ADR-011).
webkit2gtk = "=2.0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
