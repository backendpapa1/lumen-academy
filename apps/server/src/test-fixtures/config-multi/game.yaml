# Game tunables. Server code reads these; never inline them.
period:
  defaultMinutes: 15
  minMinutes: 5
  maxMinutes: 45
  resumeWithinHours: 12

cohort: { min: 4, mode: 9, max: 15 } # triangular distribution (docs/03 §5.2)
classroomsPerSchool: 6

cadet:
  maxWords: 60

# The mirror (docs/03 §4.3, ADR-006 D4). Tuned by scripts/sim-comprehension (M1-S3).
comprehension:
  base: 0.24 # tuned by pnpm sim:comprehension --search (spike M1-S3)
  styleBonus: 0.05
  directorAdjustBound: 0.10
  deltaMin: -0.3
  deltaMax: 0.4
  misconceptionAdoption: 0.6 # p = (1 - skepticism) × this
  lowConfidenceWeight: 0.5 # deltas from a Director fallback turn count at 50%
  understoodAt: 0.75

# Registration (docs/03 §5.2). Archetypes are drawn in code (seeded); the LLM writes flavour only.
registration:
  batchSize: 3 # cadets per flavour call, so the first arrivals appear fast
  guaranteed: # always present, in this order, once the cohort reaches the size
    - { archetype: skeptic, minSize: 1 }
    - { archetype: lost_signal, minSize: 1 }
    - { archetype: literalist, minSize: 1 }
    - { archetype: overachiever, minSize: 6 }
    - { archetype: pragmatist, minSize: 8 }
  weights: # remaining slots; saboteur only when unlocked
    standard:
      {
        lost_signal: 3,
        skeptic: 2,
        connector: 2,
        pragmatist: 2,
        quiet: 2,
        literalist: 1,
        overachiever: 1,
      }
    gentle:
      {
        lost_signal: 2,
        skeptic: 1,
        connector: 2,
        pragmatist: 3,
        quiet: 3,
        literalist: 3,
        overachiever: 1,
      }
    ruthless:
      {
        lost_signal: 2,
        skeptic: 4,
        connector: 1,
        pragmatist: 1,
        quiet: 1,
        literalist: 1,
        overachiever: 3,
        saboteur: 2,
      }
  homeworlds:
    [
      Titan Shipyards,
      Europa Deep,
      Ceres Exchange,
      Lagos Orbital,
      Mars Commons,
      Ganymede Rings,
      Luna Arcology,
      Callisto Reach,
      Vesta Foundry,
      Io Relay,
    ]
  # Sampled in code so classes are diverse (docs/07 §2.1); the LLM fits names and looks to them.
  heritage:
    [
      West African,
      East African,
      South Asian,
      East Asian,
      Southeast Asian,
      Latin American,
      Middle Eastern,
      Northern European,
      Southern European,
      Pacific Islander,
      Caribbean,
      Central Asian,
    ]
  genderPresentation: [feminine, masculine, androgynous]
  ageRange: [late teens, early twenties, mid twenties]

# Archetype trait means (docs/03 §5.3); each cadet draws ± traitSpread around them (seeded).
traitSpread: 0.12
archetypes:
  skeptic:
    { attention: 0.7, skepticism: 0.9, curiosity: 0.6, verbosity: 0.5, confidence: 0.8, humor: 0.3 }
  lost_signal:
    {
      attention: 0.45,
      skepticism: 0.3,
      curiosity: 0.6,
      verbosity: 0.6,
      confidence: 0.3,
      humor: 0.5,
    }
  overachiever:
    { attention: 0.9, skepticism: 0.5, curiosity: 0.9, verbosity: 0.7, confidence: 0.8, humor: 0.4 }
  literalist:
    {
      attention: 0.65,
      skepticism: 0.5,
      curiosity: 0.5,
      verbosity: 0.4,
      confidence: 0.5,
      humor: 0.3,
    }
  pragmatist:
    { attention: 0.6, skepticism: 0.6, curiosity: 0.6, verbosity: 0.5, confidence: 0.6, humor: 0.5 }
  connector:
    { attention: 0.6, skepticism: 0.4, curiosity: 0.8, verbosity: 0.7, confidence: 0.6, humor: 0.7 }
  quiet:
    { attention: 0.5, skepticism: 0.5, curiosity: 0.4, verbosity: 0.1, confidence: 0.3, humor: 0.3 }
  saboteur:
    {
      attention: 0.6,
      skepticism: 0.2,
      curiosity: 0.5,
      verbosity: 0.7,
      confidence: 0.95,
      humor: 0.6,
    }

fatigue: # attention multiplier: 1.0 until onset, then declines per minute to floor
  onsetMinute: 10
  perMinute: 0.03
  floor: 0.6

status: # concept status derivation (docs/06 §3)
  weakScore: 0.6
  weakComprehension: 0.5
  weakMinExposures: 7 # mean turns per cadet; an average cadet needs ~6 clear turns (sim M1-S3)
  masteredScore: 0.7
  masteredComprehension: 0.7

exam:
  passThreshold: 0.7
  unlockTaughtFraction: 0.7

buildingTiers: [0.25, 0.6, 1.0] # mastered fraction for tiers 2, 3, 4 (docs/02 §7.3)

xp: # docs/02 §7.1
  teachingMinute: 10
  questionAnswered: 15
  misconceptionCorrected: 30
  submissionGraded: 10
  exitTicketComplete: 25
  examPassPerAvgScore: 200
  glitchCaught: 50

ranks: # placeholder thresholds; tune after M5
  - { name: Cadet Instructor, minXp: 0 }
  - { name: Lecturer, minXp: 500 }
  - { name: Professor, minXp: 2000 }
  - { name: Dean, minXp: 6000 }
  - { name: Chancellor, minXp: 15000 }
  - { name: Archon, minXp: 40000 }

events:
  enabled: true
  maxPerPeriod: 1

leakGuard:
  enabled: true
  untaughtTermThreshold: 2 # > this many untaught technical tokens forces a check

hands:
  autoPick: false
  idleSeconds: 4
  maxPerTurn: 3
