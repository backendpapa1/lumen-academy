<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen Academy</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070d; /* void */
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #world,
      #ui {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="world"></canvas>
      <canvas id="ui"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
