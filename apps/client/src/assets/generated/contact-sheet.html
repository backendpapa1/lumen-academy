<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lumen art contact sheet</title>
  <style>
    :root {
      --void: #05070d;
      --hull: #0b1020;
      --line: #22304d;
      --ink: #e6edf7;
      --dim: #8a96ad;
    }
    body {
      margin: 0;
      padding: 24px;
      background: var(--void);
      color: var(--ink);
      font:
        14px/1.4 Inter,
        system-ui,
        sans-serif;
    }
    h1 {
      font:
        600 20px "Space Grotesk",
        system-ui;
      margin: 0 0 16px;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    figure {
      margin: 0;
      background: var(--hull);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    img,
    .missing {
      display: block;
      width: 100%;
      aspect-ratio: 3/2;
      object-fit: contain;
    }
    .alpha img {
      background: repeating-conic-gradient(#1a2238 0 25%, #121a2c 0 50%) 0 0/16px 16px;
    }
    .missing {
      display: grid;
      place-items: center;
      color: var(--dim);
    }
    figcaption {
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
    }
    figcaption span {
      color: var(--dim);
      font-size: 12px;
    }
  </style>
